name: Release Docker Hub

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          # API is pure-Python and cheap to build for both architectures.
          - image: open-tgate-api
            dockerfile: open-tgate/Dockerfile.api
            platforms: linux/amd64,linux/arm64
          # Worker compiles TDLib (C++) from source; arm64 would run under QEMU
          # emulation and is impractical in CI, so it is published amd64-only.
          - image: open-tgate-worker
            dockerfile: open-tgate/Dockerfile.worker
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # Pinned to an immutable commit SHA (supply-chain hardening / CodeQL).
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish immutable release
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Record digest
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo "platforms: ${{ matrix.platforms }}"
          } >> "$GITHUB_STEP_SUMMARY"
