name: Open-TGate CI

on:
  pull_request:
    branches: [develop, staging, main, master]
  push:
    branches: [develop, staging, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject common committed secret files
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env|\.env\.(local|production|staging)|credentials\.json|service-account\.json)$' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden secret-bearing files are tracked:"
            echo "$bad"
            exit 1
          fi
      - name: Verify application secret contract contains names only
        shell: bash
        run: |
          test -f open-tgate/.env.example || exit 0
          if grep -E '=(ghp_|sb_secret_|sbp_|cfk_|[0-9]+:AA[A-Za-z0-9_-]+)' open-tgate/.env.example; then
            echo 'Credential-like value found in .env.example'
            exit 1
          fi

  tdlib-configure:
    name: TDLib configure smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make zlib1g-dev libssl-dev gperf php-cli
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

  application-contract:
    name: Application contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Open-TGate structure
        shell: bash
        run: |
          test -f docs/OPEN_TGATE_ARCHITECTURE.md
          test -f open-tgate/README.md
          test -f open-tgate/.env.example
          test -f open-tgate/Dockerfile.api
          test -f open-tgate/Dockerfile.worker
          test -f open-tgate/dashboard/wrangler.toml

  application-tests:
    name: Application tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-tgate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: open-tgate/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q
      - name: Build API image
        working-directory: ${{ github.workspace }}
        run: docker build -f open-tgate/Dockerfile.api -t open-tgate-api:test .
      - name: Smoke API runtime health contract
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name open-tgate-api-ci -p 18000:8000 open-tgate-api:test
          trap 'docker rm -f open-tgate-api-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18000/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs open-tgate-api-ci
          exit 1
      - name: Build worker image
        working-directory: ${{ github.workspace }}
        run: docker build -f open-tgate/Dockerfile.worker -t open-tgate-worker:test .
      - name: Smoke worker entrypoint and TDLib startup
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name open-tgate-worker-ci \
            -e SUPABASE_URL=http://127.0.0.1:9 \
            -e SUPABASE_SECRET_KEY=ci-placeholder \
            -e HEARTBEAT_INTERVAL_SECONDS=1 \
            open-tgate-worker:test
          worker_log=$(mktemp)
          trap 'docker rm -f open-tgate-worker-ci >/dev/null 2>&1 || true; rm -f "$worker_log"' EXIT
          for attempt in $(seq 1 20); do
            # Read all log output before matching: grep -q can give docker
            # SIGPIPE under pipefail when heartbeat tracebacks are large.
            docker logs open-tgate-worker-ci >"$worker_log" 2>&1
            if [ "$(docker inspect --format '{{.State.Running}}' open-tgate-worker-ci)" != true ]; then
              cat "$worker_log"
              exit 1
            fi
            if grep -q 'TDLib loaded' "$worker_log"; then
              exit 0
            fi
            sleep 1
          done
          docker logs open-tgate-worker-ci
          exit 1
      - name: Validate Cloudflare Worker
        working-directory: open-tgate/dashboard
        run: npm install && npm run check
